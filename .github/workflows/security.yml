name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-security.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt --use-feature=truststore
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Check repository secrets and offline policy
        run: python tools/security_audit.py .
      - name: Run static security analysis
        run: python -m bandit -r src tools -ll -ii
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict
      - name: Run security regression tests
        run: >-
          python -m pytest
          tests/test_security_policy.py
          tests/test_security_behavior.py
          tests/test_project_security.py
          -q
